name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code (integer)'
        required: true
        default: '1'
      version_name:
        description: 'Version name (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      app_name:
        description: 'Application name'
        required: true
        default: 'LinkWeb'
      upload_to_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      release_notes:
        description: 'Release notes for GitHub Release'
        required: false
        default: 'Automated release build'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter skeleton (Android only)
        run: |
          flutter create --platforms=android --org com.linkweb linkweb_build

      - name: Copy sources into skeleton
        run: |
          rsync -a app/ linkweb_build/

      - name: Force Android minSdk = 24
        run: |
          set -euo pipefail
          GROOVY="linkweb_build/android/app/build.gradle"
          KTS="linkweb_build/android/app/build.gradle.kts"

          if [ -f "$GROOVY" ]; then
            sed -i -E 's/minSdkVersion[[:space:]]+[^[:space:]]+/minSdkVersion 24/' "$GROOVY"
          elif [ -f "$KTS" ]; then
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*[^[:space:]]+/minSdk = 24/' "$KTS"
          else
            echo "❌ Gradle file not found"
            find linkweb_build/android -maxdepth 5 -type f -name "build.gradle*"
            exit 1
          fi

      - name: Set Version Code and Version Name
        run: |
          cat >> linkweb_build/android/local.properties << EOF
          flutter.versionCode=${{ github.event.inputs.version_code }}
          flutter.versionName=${{ github.event.inputs.version_name }}
          EOF

      - name: Set Application Name (支持中文)
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          MANIFEST="linkweb_build/android/app/src/main/AndroidManifest.xml"
          
          python3 << 'PYTHON_SCRIPT'
          import re
          import sys
          
          app_name = '''${{ github.event.inputs.app_name }}'''
          manifest_path = 'linkweb_build/android/app/src/main/AndroidManifest.xml'
          
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()
          
          content = re.sub(
              r'android:label="[^"]*"',
              f'android:label="{app_name}"',
              content
          )
          
          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(content)
          
          print(f"✅ App name set to: {app_name}")
          PYTHON_SCRIPT

      - name: Verify Manifest
        run: |
          echo "📄 Checking AndroidManifest.xml:"
          grep "android:label" linkweb_build/android/app/src/main/AndroidManifest.xml || true

      - name: Prepare Keystore
        run: |
          set -euo pipefail
          
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || { echo "❌ Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || { echo "❌ Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] || { echo "❌ Missing ANDROID_KEY_ALIAS"; exit 1; }
          [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ] || { echo "❌ Missing ANDROID_KEY_PASSWORD"; exit 1; }
          
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          KEYSTORE_PATH="$(realpath keystore.jks)"
          
          if [ ! -f "$KEYSTORE_PATH" ] || [ ! -s "$KEYSTORE_PATH" ]; then
            echo "❌ Keystore file is empty or invalid"
            exit 1
          fi
          
          echo "✅ Keystore size: $(stat -c%s "$KEYSTORE_PATH" 2>/dev/null || stat -f%z "$KEYSTORE_PATH") bytes"
          
          cat > linkweb_build/android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$KEYSTORE_PATH
          EOF
          
          echo "✅ Keystore prepared at: $KEYSTORE_PATH"
          echo "🔑 Key alias: ${{ secrets.ANDROID_KEY_ALIAS }}"

      - name: Configure Gradle for signing
        run: |
          set -euo pipefail
          GROOVY="linkweb_build/android/app/build.gradle"
          
          if [ ! -f "$GROOVY" ]; then
            echo "❌ build.gradle not found"
            exit 1
          fi
          
          if grep -q "signingConfigs" "$GROOVY"; then
            echo "⚠️  Signing config already exists"
          else
            cat > /tmp/keystore_load.gradle << 'EOF'
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }
          
          EOF
            
            cat > /tmp/signing_configs.gradle << 'EOF'
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                      storePassword keystoreProperties['storePassword']
                  }
              }
          EOF
            
            awk '/^android \{/ {print; system("cat /tmp/keystore_load.gradle"); next} 1' "$GROOVY" > /tmp/build.gradle.tmp
            mv /tmp/build.gradle.tmp "$GROOVY"
            
            awk '/buildTypes \{/ {system("cat /tmp/signing_configs.gradle"); print; next} 1' "$GROOVY" > /tmp/build.gradle.tmp
            mv /tmp/build.gradle.tmp "$GROOVY"
            
            sed -i '/release {/a\            signingConfig signingConfigs.release' "$GROOVY"
            
            echo "✅ Gradle signing configuration added"
          fi
          
          echo "📄 Checking signing config:"
          grep -A 8 "signingConfigs" "$GROOVY" || echo "⚠️  No signingConfigs found"

      - name: Get dependencies
        working-directory: linkweb_build
        run: flutter pub get

      - name: Build signed release APK
        working-directory: linkweb_build
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi
          
          echo "📦 Build output:"
          find build/app/outputs -name "*.apk" -exec ls -lh {} \;

      - name: Verify APK signature
        run: |
          echo "🔍 Verifying APK signatures..."
          for apk in linkweb_build/build/app/outputs/flutter-apk/app-*-release.apk; do
            if [ -f "$apk" ]; then
              echo "Checking: $(basename "$apk")"
              jarsigner -verify -verbose -certs "$apk" | head -20 || true
              echo "---"
            fi
          done

      - name: Rename and collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          
          VERSION="${{ github.event.inputs.version_name }}"
          APP_NAME="${{ github.event.inputs.app_name }}"
          SAFE_APP_NAME=$(echo "$APP_NAME" | tr -cd '[:alnum:]_-' || echo "LinkWeb")
          
          for apk in linkweb_build/build/app/outputs/flutter-apk/app-*-release.apk; do
            if [ ! -f "$apk" ]; then
              continue
            fi
            
            basename=$(basename "$apk")
            if [[ $basename == *"arm64-v8a"* ]]; then
              cp "$apk" "dist/${SAFE_APP_NAME}-${VERSION}-arm64-v8a.apk"
            elif [[ $basename == *"armeabi-v7a"* ]]; then
              cp "$apk" "dist/${SAFE_APP_NAME}-${VERSION}-armeabi-v7a.apk"
            elif [[ $basename == *"x86_64"* ]]; then
              cp "$apk" "dist/${SAFE_APP_NAME}-${VERSION}-x86_64.apk"
            else
              cp "$apk" "dist/${SAFE_APP_NAME}-${VERSION}.apk"
            fi
          done
          
          echo "✅ APKs ready:"
          ls -lh dist/

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: APKs-${{ github.run_number }}-v${{ github.event.inputs.version_name }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: github.event.inputs.upload_to_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          
          TAG="v${{ github.event.inputs.version_name }}"
          
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating..."
            gh release edit "$TAG" \
              --title "$TAG - ${{ github.event.inputs.app_name }}" \
              --notes "${{ github.event.inputs.release_notes }}"
          else
            echo "Creating new release $TAG"
            gh release create "$TAG" \
              --title "$TAG - ${{ github.event.inputs.app_name }}" \
              --notes "${{ github.event.inputs.release_notes }}"
          fi
          
          gh release upload "$TAG" dist/*.apk --clobber
          
          echo "✅ Release created/updated: https://github.com/${{ github.repository }}/releases/tag/${TAG}"