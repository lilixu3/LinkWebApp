name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code (integer)'
        required: true
        default: '1'
      version_name:
        description: 'Version name (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      app_name:
        description: 'Application name'
        required: true
        default: 'LinkWeb'
      upload_to_release:
        description: 'Upload to GitHub Release'
        required: true
        type: boolean
        default: true
      release_notes:
        description: 'Release notes for GitHub Release'
        required: false
        default: 'Automated release build'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter skeleton (Android only)
        run: |
          flutter create --platforms=android --org com.linkweb linkweb_build

      - name: Copy sources into skeleton
        run: |
          rsync -a app/ linkweb_build/

      - name: Force Android minSdk = 24
        run: |
          set -euo pipefail
          GROOVY="linkweb_build/android/app/build.gradle"
          KTS="linkweb_build/android/app/build.gradle.kts"

          if [ -f "$GROOVY" ]; then
            sed -i -E 's/minSdkVersion[[:space:]]+[^[:space:]]+/minSdkVersion 24/' "$GROOVY"
          elif [ -f "$KTS" ]; then
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*[^[:space:]]+/minSdk = 24/' "$KTS"
          else
            echo "❌ Gradle file not found"
            find linkweb_build/android -maxdepth 5 -type f -name "build.gradle*"
            exit 1
          fi

      - name: Set Version Code and Version Name
        run: |
          cat >> linkweb_build/android/local.properties << EOF
          flutter.versionCode=${{ github.event.inputs.version_code }}
          flutter.versionName=${{ github.event.inputs.version_name }}
          EOF

      - name: Set Application Name
        run: |
          sed -i "s/android:label=\".*\"/android:label=\"${{ github.event.inputs.app_name }}\"/" \
            linkweb_build/android/app/src/main/AndroidManifest.xml

      - name: Prepare Keystore
        run: |
          set -euo pipefail
          
          # 验证所有必需的 secrets
          [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] || { echo "❌ Missing ANDROID_KEYSTORE_BASE64"; exit 1; }
          [ -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] || { echo "❌ Missing ANDROID_KEYSTORE_PASSWORD"; exit 1; }
          [ -n "${{ secrets.ANDROID_KEY_ALIAS }}" ] || { echo "❌ Missing ANDROID_KEY_ALIAS"; exit 1; }
          [ -n "${{ secrets.ANDROID_KEY_PASSWORD }}" ] || { echo "❌ Missing ANDROID_KEY_PASSWORD"; exit 1; }
          
          # 解码 keystore
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          KEYSTORE_PATH="$(realpath keystore.jks)"
          
          # 创建 key.properties（Flutter 签名配置）
          cat > linkweb_build/android/key.properties << EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=$KEYSTORE_PATH
          EOF
          
          echo "✅ Keystore prepared at: $KEYSTORE_PATH"

      - name: Configure Gradle for signing
        run: |
          set -euo pipefail
          
          # 修改 app/build.gradle 或 app/build.gradle.kts 以使用 key.properties
          GROOVY="linkweb_build/android/app/build.gradle"
          KTS="linkweb_build/android/app/build.gradle.kts"
          
          if [ -f "$GROOVY" ]; then
            # Groovy 格式
            if ! grep -q "key.properties" "$GROOVY"; then
              # 在 android { 之前添加配置
              sed -i '/^android {/i \
def keystoreProperties = new Properties()\
def keystorePropertiesFile = rootProject.file("key.properties")\
if (keystorePropertiesFile.exists()) {\
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\
}\
' "$GROOVY"
              
              # 在 buildTypes { 内添加 signingConfigs
              sed -i '/buildTypes {/i \
    signingConfigs {\
        release {\
            keyAlias keystoreProperties["keyAlias"]\
            keyPassword keystoreProperties["keyPassword"]\
            storeFile file(keystoreProperties["storeFile"])\
            storePassword keystoreProperties["storePassword"]\
        }\
    }\
' "$GROOVY"
              
              # 修改 release buildType 使用 signingConfig
              sed -i '/buildTypes {/,/}/ s/release {/release {\n            signingConfig signingConfigs.release/' "$GROOVY"
            fi
          elif [ -f "$KTS" ]; then
            # Kotlin DSL 格式（较少见，根据需要调整）
            echo "⚠️ Detected build.gradle.kts - manual configuration may be needed"
          fi

      - name: Get dependencies
        working-directory: linkweb_build
        run: flutter pub get

      - name: Build signed release APK
        working-directory: linkweb_build
        run: |
          set -euo pipefail
          flutter build apk --release --split-per-abi
          
          # 验证 APK 已签名
          if command -v apksigner >/dev/null 2>&1; then
            for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
              echo "Verifying: $apk"
              apksigner verify "$apk" || { echo "❌ APK not signed properly"; exit 1; }
            done
          fi

      - name: Rename and collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          
          VERSION="${{ github.event.inputs.version_name }}"
          
          # 重命名各架构的 APK
          for apk in linkweb_build/build/app/outputs/flutter-apk/app-*-release.apk; do
            if [[ $apk == *"arm64-v8a"* ]]; then
              cp "$apk" "dist/${{ github.event.inputs.app_name }}-${VERSION}-arm64-v8a.apk"
            elif [[ $apk == *"armeabi-v7a"* ]]; then
              cp "$apk" "dist/${{ github.event.inputs.app_name }}-${VERSION}-armeabi-v7a.apk"
            elif [[ $apk == *"x86_64"* ]]; then
              cp "$apk" "dist/${{ github.event.inputs.app_name }}-${VERSION}-x86_64.apk"
            else
              # 通用 APK（如果只有一个）
              cp "$apk" "dist/${{ github.event.inputs.app_name }}-${VERSION}.apk"
            fi
          done
          
          echo "✅ APKs ready:"
          ls -lh dist/

      - name: Upload APKs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: "APKs-${{ github.run_number }}-v${{ github.event.inputs.version_name }}"
          path: dist/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ github.event.inputs.upload_to_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          
          TAG="v${{ github.event.inputs.version_name }}"
          
          # 创建或更新 Release
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, updating..."
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes "${{ github.event.inputs.release_notes }}"
          else
            echo "Creating new release $TAG"
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "${{ github.event.inputs.release_notes }}"
          fi
          
          # 上传 APKs
          gh release upload "$TAG" dist/*.apk --clobber
          
          echo "✅ Release created/updated: https://github.com/${{ github.repository }}/releases/tag/${TAG}"