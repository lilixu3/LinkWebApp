name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Version code (integer)'
        required: true
        default: '1'
      version_name:
        description: 'Version name (e.g., 1.0.0)'
        required: true
        default: '1.0.0'
      app_name:
        description: 'Application name'
        required: true
        default: 'LinkWeb'
      upload_to_release:
        description: 'Upload to GitHub Release'
        required: true
        default: 'true'
        options:
          - 'true'
          - 'false'
      release_notes:
        description: 'Release notes for GitHub Release'
        required: false
        default: 'No notes provided.'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Flutter skeleton (Android only)
        run: |
          flutter create --platforms=android --org com.linkweb linkweb_build

      - name: Copy sources into skeleton (overlay only)
        run: |
          rsync -a app/ linkweb_build/

      - name: Force Android minSdk = 24 (required by webview_flutter)
        run: |
          set -e
          GROOVY="linkweb_build/android/app/build.gradle"
          KTS="linkweb_build/android/app/build.gradle.kts"

          if [ -f "$GROOVY" ]; then
            # e.g. minSdkVersion flutter.minSdkVersion  ->  minSdkVersion 24
            sed -i -E 's/minSdkVersion[[:space:]]+[^[:space:]]+/minSdkVersion 24/' "$GROOVY"
          elif [ -f "$KTS" ]; then
            # e.g. minSdk = flutter.minSdkVersion  ->  minSdk = 24
            sed -i -E 's/minSdk[[:space:]]*=[[:space:]]*[^[:space:]]+/minSdk = 24/' "$KTS"
          else
            echo "Gradle file not found. Listing build.gradle* under android:"
            find linkweb_build/android -maxdepth 5 -type f -name "build.gradle*" -print
            exit 1
          fi

      - name: Set Version Code and Version Name
        run: |
          echo "versionCode=${{ github.event.inputs.version_code }}" >> linkweb_build/android/app/local.properties
          echo "versionName=${{ github.event.inputs.version_name }}" >> linkweb_build/android/app/local.properties

      - name: Set Application Name
        run: |
          sed -i "s/android:label=\".*\"/android:label=\"${{ github.event.inputs.app_name }}\"/" linkweb_build/android/app/src/main/AndroidManifest.xml

      - name: Set up Keystore
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Print Keystore Information (for debugging)
        run: |
          keytool -list -v -keystore keystore.jks
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Get dependencies
        working-directory: linkweb_build
        run: flutter pub get

      - name: Build release APK
        working-directory: linkweb_build
        run: flutter build apk --release

      - name: Sign APK with apksigner
        run: |
          apksigner sign --ks keystore.jks --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" --key-pass pass:"$ANDROID_KEY_PASSWORD" --out linkweb_build/build/app/outputs/flutter-apk/app-release-signed.apk linkweb_build/build/app/outputs/flutter-apk/app-release.apk
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Rename APK
        run: |
          cp linkweb_build/build/app/outputs/flutter-apk/app-release-signed.apk app-release.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app-release.apk

      - name: Create GitHub Release (tag only)
        if: startsWith(github.ref, 'refs/tags/') && ${{ github.event.inputs.upload_to_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
          body: ${{ github.event.inputs.release_notes }}
